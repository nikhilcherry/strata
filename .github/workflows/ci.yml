name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the history tests need real history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git for the temporary-repository tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Analyse this repository with itself
        run: |
          python -m strata dig . -o /tmp/self.html --json /tmp/self.json --no-color
          test -s /tmp/self.html
          python -c "import json; d=json.load(open('/tmp/self.json')); assert d['files'], 'no files analysed'"
